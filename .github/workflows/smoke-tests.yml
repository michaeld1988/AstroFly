name: Smoke tests

# Echte Browser-Tests (Chromium) gegen alle drei Kanaele: Seite laedt,
# Demo wird erkannt, jeder Flug-Preset rendert, Gaia gegen den echten
# Katalogserver, Offline-Export liefert eine Datei.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          CHANNELS: root,beta,alpha
          NETWORK: "1"
        run: node tests/run.js
